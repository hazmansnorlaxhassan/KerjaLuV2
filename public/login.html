<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - KerjaLu</title>
  <link rel="stylesheet" href="/styles.css?v=3.0">
  <script src="/theme.js?v=3.0"></script>
</head>
<body>

  <header>
    <div class="container nav-container">
      <a href="/" class="logo">KerjaLu <span>GIGS</span></a>
      <nav style="display: flex; align-items: center; gap: 16px;">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/register" class="btn btn-primary btn-small">Get Started</a></li>
        </ul>
        <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Switch to Dark Mode" title="Switch to Dark Mode">
          <span class="theme-toggle-icon-wrap" style="display:inline-flex;align-items:center;">
            <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </span>
          <span class="theme-toggle-label">Dark</span>
        </button>
      </nav>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="glass-panel auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Log in to access your KerjaLu dashboard</p>
      </div>

      <div id="alert-box" class="alert-box"></div>

      <!-- Quick Demo Login Section -->
      <div class="quick-login-section">
        <div class="quick-login-header">
          <span class="quick-login-badge">⚡ Quick Demo Login</span>
          <span class="quick-login-hint">1-click instant access</span>
        </div>

        <div class="quick-login-grid">
          <button type="button" class="quick-btn quick-btn-jobseeker" id="quick-jobseeker-btn">
            <div class="quick-btn-icon">💼</div>
            <div class="quick-btn-info">
              <span class="quick-btn-role">Jobseeker</span>
              <span class="quick-btn-desc">Jane (Freelancer)</span>
            </div>
            <span class="quick-btn-arrow">→</span>
          </button>

          <button type="button" class="quick-btn quick-btn-employer" id="quick-employer-btn">
            <div class="quick-btn-icon">🏢</div>
            <div class="quick-btn-info">
              <span class="quick-btn-role">Employer</span>
              <span class="quick-btn-desc">John (Hiring)</span>
            </div>
            <span class="quick-btn-arrow">→</span>
          </button>
        </div>
      </div>

      <div class="auth-divider">
        <span>or sign in with email</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/register">Create one here</a></p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const quickJobseekerBtn = document.getElementById('quick-jobseeker-btn');
    const quickEmployerBtn = document.getElementById('quick-employer-btn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Quick Login Handler
    async function executeQuickLogin(role, targetBtn) {
      alertBox.className = 'alert-box';
      alertBox.style.display = 'none';

      // Visual loading state
      quickJobseekerBtn.classList.add('loading');
      quickEmployerBtn.classList.add('loading');
      const originalText = targetBtn.querySelector('.quick-btn-desc').textContent;
      targetBtn.querySelector('.quick-btn-desc').textContent = 'Connecting...';

      // Populate form fields visually
      if (role === 'jobseeker') {
        emailInput.value = 'jane_new@jobseeker.com';
        passwordInput.value = '••••••••';
      } else {
        emailInput.value = 'john@employer.com';
        passwordInput.value = '••••••••';
      }

      try {
        const response = await fetch('/api/auth/quick-login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ role })
        });

        const data = await response.json();

        if (response.ok) {
          targetBtn.querySelector('.quick-btn-desc').textContent = 'Redirecting...';
          alertBox.textContent = `⚡ Success! Logged in as ${data.user.username} (${data.user.role}). Redirecting to dashboard...`;
          alertBox.className = 'alert-box alert-box-success';
          alertBox.style.display = 'block';

          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 800);
        } else {
          alertBox.textContent = data.message || 'Quick login failed. Please try again.';
          alertBox.className = 'alert-box alert-box-error';
          alertBox.style.display = 'block';
          quickJobseekerBtn.classList.remove('loading');
          quickEmployerBtn.classList.remove('loading');
          targetBtn.querySelector('.quick-btn-desc').textContent = originalText;
        }
      } catch (err) {
        console.error(err);
        alertBox.textContent = 'A network error occurred. Please try again.';
        alertBox.className = 'alert-box alert-box-error';
        alertBox.style.display = 'block';
        quickJobseekerBtn.classList.remove('loading');
        quickEmployerBtn.classList.remove('loading');
        targetBtn.querySelector('.quick-btn-desc').textContent = originalText;
      }
    }

    quickJobseekerBtn.addEventListener('click', () => executeQuickLogin('jobseeker', quickJobseekerBtn));
    quickEmployerBtn.addEventListener('click', () => executeQuickLogin('employer', quickEmployerBtn));

    // Standard Form Submit Handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert-box';
      alertBox.style.display = 'none';

      const email = emailInput.value;
      const password = passwordInput.value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          alertBox.textContent = 'Login successful! Redirecting...';
          alertBox.className = 'alert-box alert-box-success';
          alertBox.style.display = 'block';

          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1000);
        } else {
          alertBox.textContent = data.message || 'Login failed. Please check credentials.';
          alertBox.className = 'alert-box alert-box-error';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        alertBox.textContent = 'An error occurred. Please try again.';
        alertBox.className = 'alert-box alert-box-error';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
